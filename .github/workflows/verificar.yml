# Corre las pruebas en cada pull request, antes de permitir la fusión.
name: Verificar

on:
  pull_request:
    branches: [main]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verificar
      - run: npm run build
